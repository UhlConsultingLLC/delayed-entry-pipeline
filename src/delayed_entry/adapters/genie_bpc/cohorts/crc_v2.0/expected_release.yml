# What the CRC v2.0-public release should contain, for the check after downloading
# (python -m delayed_entry.adapters.genie_bpc.check_download). Copied from the CRC BPC project
# (sql/00_expected_release.yml), with the check limits that project wrote into its code moved to `checks`.
#
# files: every file in the two Synapse folders, with the name, size and MD5 checksum Synapse reports. Read from
# Synapse on 2026-11-09 as metadata only: no file was downloaded to write this list. used: true marks the files the
# analysis reads; a difference in one of them stops the run, and a difference in any other is only reported.
# values: the values the data documentation lists for each coded column the rules read, from the variable synopsis
# (syn39433163, version 2). stops: true means a value not on the list stops the run.
# checks: the limits of the data checks (not analysis choices): how much disagreement each check tolerates.

checks:
  min_call_link: 0.80          # share of report samples that should have at least one mutation call
  max_unit_mismatch: 0.01      # share of rows allowed to disagree in the unit checks
  report_months_tolerance: 0.5     # months: report months against report days / 30.4375
  age_years_tolerance: 1.5         # years: age at diagnosis against days from birth / 365.25
  report_days_tolerance: 1.5       # days: report day from birth against diagnosis day + report day
  age_range: [0, 120]
  birth_year_range: [1900, 2010]

folders:
  clinical: syn39802567
  genomic: syn39802595

panels: ["DFCI-ONCOPANEL-2", "DFCI-ONCOPANEL-3", "MSK-IMPACT341", "MSK-IMPACT410", "MSK-IMPACT468", "VICC-01-SOLIDTUMOR", "VICC-01-T5A", "VICC-01-T7"]

