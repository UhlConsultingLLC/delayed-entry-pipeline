# GENIE BPC CRC v2.0-public: the raw tables, which file each one is read from, and a fixed type for
# every column the adapter uses, so DuckDB never has to guess it. Other columns are read with
# DuckDB's own guesses. Copied from the CRC BPC project (sql/00_raw_files.yml), less its made-up
# truth file, which only that project's tests read.
#
# folder: "clinical" or "genomic" (the two Synapse downloads; made-up data may have both in one folder).
#
# Times in days or months are DOUBLE: decimals are allowed, because whole days aren't
# confirmed in the real files.

raw_patient:
  file: patient_level_dataset.csv
  folder: clinical
  types:
    record_id: VARCHAR
    institution: VARCHAR
    redacted: VARCHAR          # "Yes"/"No": as text, or DuckDB would guess BOOLEAN
    birth_year: INTEGER
    naaccr_sex_code: VARCHAR
    race_ethnicity: VARCHAR

raw_cancer:
  file: cancer_level_dataset_index.csv
  folder: clinical
  types:
    record_id: VARCHAR
    ca_seq: INTEGER
    redcap_ca_index: VARCHAR
    dob_ca_dx_days: DOUBLE
    age_dx: DOUBLE
    ca_d_site: VARCHAR
    ca_hist_adeno_squamous: VARCHAR
    stage_dx: VARCHAR
    crc_type: VARCHAR
    os_dx_status: INTEGER
    tt_os_dx_days: DOUBLE

raw_report:
  file: cancer_panel_test_level_dataset.csv
  folder: clinical
  types:
    record_id: VARCHAR
    ca_seq: INTEGER
    cpt_number: INTEGER
    cpt_n_ca_seq: INTEGER
    dob_cpt_report_days: DOUBLE
    dx_cpt_rep_days: DOUBLE
    dx_cpt_rep_mos: DOUBLE
    cpt_report_post_death: INTEGER
    cpt_report_post_last_alive: INTEGER
    cpt_genie_sample_id: VARCHAR
    sample_type: VARCHAR
    cpt_seq_assay_id: VARCHAR
    cpt_seq_date: VARCHAR      # the year of sequencing, stored as text

raw_mutation:
  file: data_mutations_extended.txt
  folder: genomic
  types:
    Hugo_Symbol: VARCHAR
    Variant_Classification: VARCHAR
    HGVSp_Short: VARCHAR
    Tumor_Sample_Barcode: VARCHAR

# Cancers that aren't BPC Project cancers: used only to find other colorectal primaries (plan 4b).
raw_cancer_other:
  file: cancer_level_dataset_non_index.csv
  folder: clinical
  types:
    record_id: VARCHAR
    ca_seq: INTEGER
    redcap_ca_index: VARCHAR
    ca_type: VARCHAR

