adjustment:
  variables:
    value:
      - {field: age_at_diagnosis, form: spline, knots_at_percentiles: [10, 50, 90]}
      - {field: sex, form: categorical, keep: [Male, Female]}
      - {field: center, form: categorical, keep: [DFCI, MSK, VICC], reference: MSK}
      - {field: smoking_at_diagnosis, form: categorical, reference: Never,
         merge: {Never: ["Never used"], Former: ["Former user (quit >1 year)", "Former user (unknown time)"],
                 Current: ["Current user", "Former user (quit <1 year)"]}}
      - {field: histology, form: categorical, reference: Adenocarcinoma,
         merge: {Adenocarcinoma: [Adenocarcinoma], "Carcinoma or other": [Carcinoma, Other histologies/mixed tumor]}}
      - {field: year_of_diagnosis, form: bands}
    made_by: NSCLC study author
    source: >-
      Question 11, decided 2026-11-24: age, sex, center and year carried from the CRC plan, section 4c, with race
      and ethnicity described only, as there; synopsis: the NSCLC centers DFCI, MSK and VICC (the release's
      fourth, UHN, has no assignable patient: question 6). Smoking and histology replace CRC's tumor location.
      Cigarette use at diagnosis (ca_lung_cigarette, six levels in the data guide) is merged as the release
      spells it: Never (Never used), Former (quit over a year ago, or time unknown) and Current (Current user,
      or quit under a year ago); its Unknown is missing. Histology (ca_hist_adeno_squamous) has two levels:
      Adenocarcinoma, the reference, and Carcinoma or other (Carcinoma and Other histologies/mixed tumor, the
      primary population's other two levels: question 1, decided 2026-11-23).
    note: >-
      A quit under a year counts as current, since quitting in the year before a lung cancer diagnosis is often
      because of symptoms. Race and ethnicity (race_ethnicity) are described only, as in the CRC plan: race is
      not a biological variable, and adjusting a genotype comparison for it could hide differences in access to
      care; residual confounding by Asian ancestry, which goes with EGFR, is stated. Carcinoma and Other
      histologies/mixed tumor are merged because the genotype term has five levels, and these small levels
      would leave sparse cells in the propensity and imputation models and in the balance verdict across all
      pairs of groups. Brain metastases at diagnosis are left out (on the path from genotype to survival).
      Performance status isn't in the release (a stated limitation). A blank histology and smoking's Unknown
      are missing and count toward the 5% complete-case limit; above it, missing_data.imputation_model applies.
  year_bands:
    value:
      - {label: "2013 or earlier", to: 2013}
      - {label: "2014-2015", from: 2014, to: 2015}
      - {label: "2016 or later", from: 2016}
    made_by: NSCLC study author
    source: >-
      Item C2 (the dry run), decided 2026-11-24 (the last band open): data guide, Eligibility: sequencing reports
      from 2014 to 2017; bands merged when small, as in the CRC plan, section 4c. The last band is "2016 or
      later" because the year of diagnosis is estimated, from the birth year and the age at diagnosis
      (floor(birth_year + 0.5 + dob_ca_dx_days / 365.25), the CRC plan, section 4c), so it is off by one year
      for about a quarter of patients, and a 2017 (or a rare 2018) diagnosis can be coded 2018. Under a band
      closed at 2017 it would fall in no band and count as missing an adjustment variable (on made-up dates,
      12% of true-2017 diagnoses; none with the open band).
    note: >-
      The open ends remove blanks only: about 1 in 8 diagnoses in each year next to a band edge (2013 and 2014,
      2015 and 2016) still falls in the neighboring band, a limitation stated in the plan (the CRC plan calls
      the year "accurate to about one year").
  band_min_patients:
    value: 30
    made_by: NSCLC study author
    source: "confirmed 2026-11-24 (not a numbered question): carried from the CRC plan, section 4c"
    note: >-
      A band under 30 patients is merged before modeling, on counts only, by the CRC plan's rule (section 4c):
      if "2013 or earlier" merges, the bands read "2015 or earlier" and "2016 or later".

missing_data:
  complete_case_max_share:
    value: 0.05
    made_by: NSCLC study author
    source: "item C2 (the dry run), decided 2026-11-24 (kept): carried from the CRC plan, section 9"
  imputations:
    value: 20
    made_by: NSCLC study author
    source: "item C2 (the dry run), decided 2026-11-24 (kept): carried from the CRC plan, section 9"
  imputation_model:
    value:
      engine: chained_equations
      outcome_terms: [event, cumulative_hazard_corrected, entry_time]
      include_group: true
      methods: {linear: pmm, spline: pmm, categorical: polyreg, bands: polyreg}
      pmm_donors: 5
      iterations: 5
      pooling: rubins_rules
      bootstrap: impute_each_resample_once
      point_estimates: average_across_imputations
    made_by: NSCLC study author
    source: >-
      Question 11, decided 2026-11-24: the CRC plan, section 9 (the event indicator, the Nelson-Aalen cumulative
      hazard with delayed entry and the entry time in the imputation model; Rubin's rules; each bootstrap
      resample imputed once; point estimates averaged across the imputations). The pipeline's own
      chained-equations engine, since the mice engine can't load on this machine; donors and iterations at
      mice's defaults, since the CRC plan said only "with mice"; the group included, since it is in every
      analysis model; multinomial draws (polyreg) for categories, since center and smoking have three levels.
    note: >-
      Set in advance: across all 1,846 v2.0-public patients, histology is Unknown for 257 (14%) (Choudhury NJ
      et al., Clin Cancer Res 2023, Table 1; reading Unknown there as a blank field is an inference), and
      squamous tumors leave the population while blanks stay, so the 5% limit is likely passed. It has no
      effect if complete case holds. If imputed, a blank histology is placed among the nonsquamous levels,
      though it may be a squamous tumor. The pipeline's multinomial draws carry mice's guard against sparse
      cells (augmenting records), checked on made-up data with a sparse cell.

