labels:
  clearly_material:
    value: estimate_and_whole_interval
    made_by: NSCLC study author
    source: >-
      Question 8, decided 2026-11-24 (option B'): carried from the CRC plan, section 11: the estimate and its whole
      95% interval are past the bar. The labels are read by this rule: for the HR-ratio and RMST-gap comparison
      rows only "clearly material" counts as material bias; "material" is reported with its interval as "past
      the bar; chance not excluded"; a group's own overstatement is read as in the CRC plan, section 11. This is
      a design difference from the CRC study, whose plan (section 11) counted either label as material bias; it
      is set before the NSCLC plan is locked, so it is not a deviation.
    note: >-
      Only this label marks material bias in a comparison between groups (the HR ratio, the change in the RMST
      gap). On made-up data with no true difference between groups, it arose by chance in about 2% of RMST-gap
      comparisons (rough, from an SD-based interval; the dry run, question 8) and in under 0.2% of HR-ratio
      comparisons (the same made-up runs, not quoted in the dry run).
  material:
    value: estimate_only
    made_by: NSCLC study author
    source: >-
      Question 8, decided 2026-11-24 (option B'): carried from the CRC plan, section 11: the estimate is past the
      bar and its interval crosses it. The labels are read by this rule: for the HR-ratio and RMST-gap comparison
      rows only "clearly material" counts as material bias; "material" is reported with its interval as "past
      the bar; chance not excluded"; a group's own overstatement is read as in the CRC plan, section 11. This is
      a design difference from the CRC study: its plan (section 11) counted either label as material bias, and
      its README found both its comparisons material only through "material" labels (RAS-mutant's RMST-gap
      change 2.7 months, interval 0.6 to 5.8; BRAF V600E's HR ratio 1.15, 0.93 to 1.39), which this rule would
      not count. Why: on made-up data with no true difference between groups, a comparison's RMST-gap change
      passed the 2-month bar 22-30% of the time with long delays (median about 3.2 months) and 8-11% with short
      ones (about 1.3 months); a bar near 5 months would bring that near 5%, more than the clinically
      meaningful gain itself (the dry run, question 8).
    note: >-
      A material comparison is reported with its interval, read as "past the bar; chance not excluded", not as
      a finding of material bias. A group's own overstatement, where the bias is expected to be large and real,
      is read as in the CRC plan: either label counts. On the same made-up data the HR-ratio change passed 10%
      about 2-7% of the time with long delays and under 1% with short ones, and the RMST-gap change passed 5
      months 3.6-5.2% of the time with long delays.

