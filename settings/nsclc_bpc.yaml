analyses:
  value:
    - id: S2
      label: Survival from the start of first-line treatment
      run: true
      kind: treatment_clock
      first_line: earliest_by_order_on_or_after_diagnosis
      if_short: describe
    - id: S3
      label: Diagnosis-to-report delay
      run: true
      kind: descriptive_delay
      by: [genotype, center, year_band]
    - id: SA1
      label: First report within 6 months of diagnosis
      run: true
      kind: subset
      keep: {within_months: 6}
      if_short: describe
    - id: SA2
      label: Adjusted model stratified by center
      run: true
      kind: adjusted_variant
      stratify_by: center
    - id: SA5
      label: Proportional hazards check
      run: true
      kind: ph_check
    - id: SA6
      label: Quasi-independence check
      run: true
      kind: quasi_independence
    - id: SA7
      label: Adenocarcinoma only
      run: true
      kind: subset
      keep: {field: histology, op: in, values: [Adenocarcinoma], normalize: trim, missing: fail}
      if_short: describe
    - id: SA10
      label: Nonsquamous only
      run: false
      kind: subset
      keep: {field: histology, op: not_in, values: ["Squamous cell"], normalize: trim, missing: pass}
      if_short: describe
    - id: SA11
      label: Without UHN
      run: false
      kind: subset
      keep: {field: center, op: not_in, values: [UHN], normalize: trim, missing: pass}
      if_short: describe
    - id: SA12
      label: Reference group only on panels that detect ALK fusions
      run: false
      kind: subset
      keep:
        fusion_detecting_panel:
          gene: ALK
          panels: [DFCI-ONCOPANEL-1, DFCI-ONCOPANEL-2, DFCI-ONCOPANEL-3, MSK-IMPACT341, MSK-IMPACT410,
                   MSK-IMPACT468, VICC-01-T5A, VICC-01-T7]
        groups: reference_only
      if_short: describe
    - id: SA13
      label: KRAS G12C only
      run: true
      kind: subset
      keep:
        exclude_from_group: KRAS mutant
        if_result:
          kind: mutation
          genes: [KRAS]
          variant_classes: [Missense_Mutation, In_Frame_Del, In_Frame_Ins]
          codons: [12, 13, 61]
          except_variants: ["p.G12C"]
      if_short: describe
  made_by: NSCLC study author
  source: >-
    Structure carried from the CRC plan, sections 7 and 8 (S2, S3, SA1, SA2, SA5, SA6, SA7), confirmed
    2026-11-24 (not a numbered question), with SA1's 6 months decided as item C2 (the dry run), kept: a first
    report at most 182.6 days (6 x 365.25 / 12) after diagnosis, a report before diagnosis included. There is no SA4:
    question 2 (decided 2026-11-23, option C) puts ROS1 and RET fusions in Other recognized driver, so the
    reference holds none and SA4 would remove no one.
    SA10 (nonsquamous only) is switched off: question 1 (decided 2026-11-23, option B) makes the primary
    population nonsquamous, so SA10 would repeat it. SA7 (adenocarcinoma only) still narrows it, leaving out
    Carcinoma, Other histologies/mixed tumor and blank histology, so it is the one view without blank-histology
    patients. SA11 leaves out UHN, the one center outside the United States: its
    sequencing window was shorter (data guide, Eligibility) and its deaths can't come from the US National
    Death Index (synopsis, hybrid_death_source). SA11 is switched off: question 6 (decided 2026-11-22) leaves no
    UHN patient assignable, since UHN's only panels are hotspot panels that can't detect ALK fusions, so SA11
    would repeat the primary analysis and question 12 is settled with it. The CRC study's S1, SA8 and SA9 concerned MSI/MMR, which the NSCLC
    pathology data don't record. SA3 (co-mutants) is left out (question 4, decided 2026-11-24, option A): the
    main groups' drivers rarely co-occur (3 of 3,625 patients in public MSK and TCGA data, all EGFR common with
    KRAS, none with ALK; genotype.groups' source), and the common case, an EGFR common tumor that also matches
    one of Other recognized driver's EGFR rules (most often by T790M), stays EGFR common by precedence. SA12
    keeps the
    reference group only
    where the entry test's panel can detect ALK fusions: in 2014-2017 ALK fusions were often found by FISH or
    IHC rather than by DNA panels, and a DNA panel detects them only if it tiles ALK's introns, so an
    ALK-positive tumor can sit unseen in the reference. The other groups keep everyone: a tumor there already
    has its driver, EGFR ranks above ALK, and ALK rarely occurs with KRAS. SA12 is switched off for this study:
    under question 6's option A (decided 2026-11-22) every assignable patient's first panel already detects ALK
    fusions, so SA12 would repeat the primary analysis. Its panels are genotype.coverage.fusion_panels' list,
    since one list must serve both. SA13 (question 5, decided 2026-11-24, option D) keeps KRAS G12C, the
    design plan's example, in view beside the primary's one KRAS group: it leaves out KRAS mutant patients
    whose first test has a KRAS missense or in-frame call at codon 12, 13 or 61 other than p.G12C, so its
    KRAS group is G12C tumors without such a second call (a G12C tumor whose second KRAS call is elsewhere,
    or silent, stays). Its rule keeps the except entry for p.G12C, or it would leave out every G12C tumor.
    Its tables still name the group KRAS mutant, and its G12C comparison, like any other, can be labeled
    material by chance. There is no PD-L1 analysis, the NSCLC
    counterpart of the CRC study's S1
    (question 10, decided 2026-11-23; named as later work). Most patients would be Unknown at entry: US PD-L1
    testing began with the first companion test, approved October 2, 2015, and reached about 75% of newly
    diagnosed metastatic patients only in 2017 (Velcheti V et al., PLoS One 2018), and 55% of the BPC NSCLC
    patients treated with a checkpoint inhibitor had no PD-L1 status (Liu et al., BMC Pulm Med 2024), so the
    analysis would fall back to description. The test's timing ties a PD-L1 group to treatment decisions and to
    survival after entry. And it would need a new PD-L1 reader, the largest remaining pipeline work. Limitation
    stated with it, the immunotherapy era: immunotherapy reached tumors without a driver, and KRAS tumors, far
    more than EGFR or ALK tumors (the first-line pembrolizumab labels exclude EGFR- and ALK-positive tumors), so
    the reference group's survival likely rose during 2015-2019 more than some driver groups'. For this
    nonsquamous population: second-line nivolumab from October 9, 2015, and first-line pembrolizumab with
    chemotherapy from May 10, 2017. The naive and
    corrected passes have no calendar-year term (the year bands enter only the adjusted and weighted models),
    and in a fixed sequencing window an earlier diagnosis means a longer delay, so the era can bend
    quasi-independence (SA6's check). A toy simulation on made-up values put the effect well under a month of
    median survival, below the materiality bars.
  note: >-
    PD-L1 is left out (question 10, decided 2026-11-23) and named as later work. SA10 is switched off by
    question 1 (decided 2026-11-23). SA4 is deleted by question 2 (decided 2026-11-23, option C); the other
    analyses keep their ids. SA3 stays out (question 4, decided 2026-11-24, option A). SA13 (KRAS G12C only)
    is added by question 5 (decided 2026-11-24, option D).

