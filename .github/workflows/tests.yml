name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only: the run checks the code and changes nothing.
permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      # Actions pinned to a commit, so a moved tag can't change what runs. Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Test (made-up data only; the tests that need R are skipped, as R isn't set up here)
        run: python -m pytest -q -p no:cacheprovider
